<style>
  /* ===== 版面與顏色 ===== */

  body {

  }
  header { background: var(--blue); color: white; padding: 18px 24px; }

  .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

  .table-wrap { overflow-x: auto; }

  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f8fafc; font-size: 14px; color: var(--muted); }
  .roster-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .roster-head h2 { margin: 0; }

  .folder-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .folder-bar.connected { background: #e0f2fe; color: #075985; }

</style>

  <header>

    <!-- 資料庫檔的連接狀態：資料存在使用者選的資料夾裡的 signin.db（Chrome、Edge 才能直接寫進資料夾） -->
    <div id="folderBar" class="note folder-bar">

<!-- sql.js 1.13.0：integrity 是 cdnjs 公布的檔案雜湊，檔案被竄改時瀏覽器會拒絕執行 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js" integrity="sha512-Yra4xuTWinXfBpG2ftgDX8MVmMiOev1FtqiYs51+kEna/5peD0kZqAL1syYCH61f9gxmAFidIJz42IKcRhWMkw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
/*
 * 教育訓練報名簽到表 signin.html
 * 基本版已完成：資料表、示範資料、新增課程、報名（名額已滿、重複報名、必填檢查）、重設，
 *   以及把資料庫存成資料夾裡的 signin.db（按「連接資料夾」選 AI實作；Chrome、Edge 才支援）
 * 功能插槽 1～3：簽到、出席率、匯出 CSV（第二步由 Codex 依 docs/plan.md 補上；標記是給 Codex 定位用的）
 */

/* ===== 設定 ===== */
// sql.js（瀏覽器版 SQLite）的載入位置
const SQL_JS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/';
// 資料庫檔的檔名（存在使用者選的資料夾裡，例如 AI實作/signin.db）
const DB_FILE = 'signin.db';
// 記住「上次連接的資料夾」用的瀏覽器內建資料庫（IndexedDB）名稱；資料本身不存在這裡
const FOLDER_MEMORY = 'qingchuan-signin-folder';
// 單位清單（下拉選單）
const DEPTS = ['護理部', '醫務部', '藥劑部', '檢驗科', '放射科', '總務室', '人資室', '資訊室', '教學研究部', '社工室'];

/* ===== 狀態 ===== */
let SQL = null;               // sql.js 函式庫
let db = null;                // 資料庫
let currentCourseId = null;   // 目前在看哪一堂課的名單
let folder = null;            // 已連接的資料夾；有值才會把資料寫進 signin.db
let savedFolder = null;       // 上次連接過、這次要再按一次「重新連接」才能用的資料夾
let unsavedChanges = false;   // 存檔失敗後還沒寫進 signin.db 的變更（重新連接時要寫回去，不能被檔案蓋掉）
let writeQueue = Promise.resolve();   // 寫檔排隊：一次寫完再寫下一次，順序不會亂

/* ===== 共用工具（功能插槽可以直接使用） ===== */

// 查詢資料：回傳物件陣列，例如 [{ id: 1, name: '陳美玲' }]
function query(sql, params = []) {
  const stmt = db.prepare(sql);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

// 執行新增或修改（SQL 一律用 ? 參數，不把輸入接成字串）
function run(sql, params = []) {
  db.run(sql, params);
}

// 把整個資料庫寫回資料夾裡的 signin.db（還沒連接資料夾就不存）
function save() {
  if (!folder) return;
  const bytes = db.export();   // 先拍下現在的資料，再排隊寫進檔案
  const target = folder;
  writeQueue = writeQueue.then(() => writeDbFile(target, bytes)).catch(e => {
    // 寫不進去（例如權限被收回）：改成要重新連接，之後的變更等重新連接時一起寫回
    const gone = e.name === 'NotFoundError';   // 資料夾被移走、改名或刪掉
    if (folder === target) {
      folder = null;
      savedFolder = gone ? null : target;
      unsavedChanges = true;
      showFolderState(gone ? 'none' : 'reconnect');
    }
    showMsg(gone
      ? `找不到資料夾 ${target.name}（被移走、改名或刪掉了？），資料沒有存到。請按「連接資料夾」重新選，畫面上的資料會寫進新的 ${DB_FILE}。`
      : `存檔失敗：${e.message}。請按「重新連接資料夾」，畫面上的資料會再寫回 ${DB_FILE}。`, 'error');
  });
}

// 顯示訊息：type 為 'ok'（綠色）或 'error'（紅色）
function showMsg(text, type = 'ok') {
  const box = document.getElementById('msg');
  box.textContent = text;
  box.className = 'msg ' + type;
  box.hidden = false;
}

// 現在時間，格式 YYYY-MM-DD HH:MM
function nowText() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 把文字裡的 HTML 符號轉成一般文字，避免被當成網頁程式執行（防 XSS）
function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// 讓瀏覽器下載一個檔案
function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ===== 資料庫 ===== */

/* ===== 資料庫檔 signin.db（存在使用者選的資料夾裡） ===== */

// 這個瀏覽器能不能直接讀寫資料夾（Chrome、Edge 可以；Safari、Firefox 與預覽視窗不行）
function folderSupported() {
  try {
    return window.isSecureContext === true && typeof window.showDirectoryPicker === 'function' && window.self === window.top;
  } catch (e) {
    return false;
  }
}

// 是不是被嵌在別的網頁裡（例如教學網站貼上工具的預覽）
function inPreview() {
  try {
    return window.self !== window.top;
  } catch (e) {
    return true;
  }
}

// 讀資料夾裡的 signin.db；沒有這個檔或是空檔就回傳 null
async function readDbFile(dir) {
  try {
    const file = await (await dir.getFileHandle(DB_FILE)).getFile();
    if (!file.size) return null;
    return new Uint8Array(await file.arrayBuffer());
  } catch (e) {
    if (e.name === 'NotFoundError') return null;
    throw e;
  }
}

// 把資料庫內容整個寫進資料夾裡的 signin.db（沒有就建立）
async function writeDbFile(dir, bytes) {
  const fileHandle = await dir.getFileHandle(DB_FILE, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(bytes);
  await writable.close();
}

// 檢查是不是 SQLite 資料庫檔：檔案開頭固定是「SQLite format 3」
function isSqliteFile(bytes) {
  const head = 'SQLite format 3';
  if (bytes.length < 100) return false;
  for (let i = 0; i < head.length; i++) {
    if (bytes[i] !== head.charCodeAt(i)) return false;
  }
  return true;
}

// 打開「記住資料夾」用的瀏覽器資料庫（IndexedDB）
function openFolderMemory() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FOLDER_MEMORY, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('folders');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// 記住這次連接的資料夾，下次打開網頁就能接回去（記不住也沒關係，下次再選一次）
async function rememberFolder(dir) {
  try {
    const mem = await openFolderMemory();
    await new Promise((resolve, reject) => {
      const tx = mem.transaction('folders', 'readwrite');
      tx.objectStore('folders').put(dir, 'last');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    mem.close();
  } catch (e) {
    /* 這個環境不能記住資料夾：不影響存檔 */
  }
}

// 取出上次連接的資料夾；沒有就回傳 null
async function recallFolder() {
  try {
    const mem = await openFolderMemory();
    const dir = await new Promise((resolve, reject) => {
      const req = mem.transaction('folders').objectStore('folders').get('last');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    mem.close();
    return dir;
  } catch (e) {
    return null;
  }
}

// 更新上方的資料夾狀態列：unsupported（不支援）、none（尚未連接）、reconnect（要重新連接）、connected（已連接）
function showFolderState(state) {
  const bar = document.getElementById('folderBar');
  const status = document.getElementById('folderStatus');
  const btn = document.getElementById('btnFolder');
  bar.classList.toggle('connected', state === 'connected');
  btn.hidden = state === 'unsupported' || state === 'connected';
  document.getElementById('btnChangeFolder').hidden = state !== 'connected';
  if (state === 'unsupported') {
    status.textContent = inPreview()
      ? '預覽模式：這裡只能看示範資料，不會保存。下載成 signin.html 後用 Chrome 或 Edge 打開，再按「連接資料夾」。'
      : '這個瀏覽器不能把資料存進資料夾：請改用 Chrome 或 Edge 打開 signin.html。現在顯示的是示範資料，不會保存。';
  } else if (state === 'none') {
    status.textContent = '尚未連接資料夾：現在顯示的是示範資料，不會保存。按右邊的按鈕選 AI實作 資料夾，資料庫會存成裡面的 signin.db。';
    btn.textContent = '連接資料夾';
  } else if (state === 'reconnect') {
    status.textContent = `上次用的資料夾：${savedFolder.name}。瀏覽器要你再允許一次，才能讀寫裡面的 ${DB_FILE}。`;
    btn.textContent = '重新連接資料夾';
  } else {
    status.textContent = `已連接資料庫檔：${folder.name}／${DB_FILE}（每次變更自動存檔）`;
  }
}

// 開始使用這個資料夾：裡面有 signin.db 就讀它（以檔案為準），沒有就把畫面上的資料寫進去
async function useFolder(dir) {
  const bytes = unsavedChanges ? null : await readDbFile(dir);
  let loaded = null;
  if (bytes) {
    try {
      if (!isSqliteFile(bytes)) throw new Error('不是 SQLite 資料庫檔');
      loaded = new SQL.Database(bytes);
      loaded.exec('SELECT COUNT(*) FROM sqlite_master');
    } catch (e) {
      if (loaded) loaded.close();
      showMsg(`${dir.name} 裡的 ${DB_FILE} 不是可用的資料庫檔，沒有連接，也沒有覆蓋它。請把它改名或移走後再連接。`, 'error');
      return false;
    }
  }
  folder = dir;
  savedFolder = null;
  if (loaded) {
    db.close();
    db = loaded;
    createTables();
    currentCourseId = null;
  }
  await rememberFolder(dir);
  showFolderState('connected');
  render();
  if (loaded) {
    const courses = query('SELECT COUNT(*) AS n FROM courses')[0].n;
    const people = query('SELECT COUNT(*) AS n FROM enrollments')[0].n;
    showMsg(`已讀取 ${DB_FILE}：${courses} 堂課、${people} 筆報名`);
  } else {
    save();
    showMsg(unsavedChanges ? `已重新連接，畫面上的資料已寫回 ${DB_FILE}` : `已在 ${dir.name} 建立 ${DB_FILE}，之後每次變更都會自動存檔`);
    unsavedChanges = false;
  }
  return true;
}

// 按「連接資料夾」或「重新連接資料夾」
async function connectFolder() {
  try {
    let dir = savedFolder;
    if (dir) {
      // 上次用過的資料夾：只要再允許一次，不用重新選
      if (await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') {
        savedFolder = null;
        showFolderState('none');
        showMsg('沒有允許編輯資料夾，資料不會保存。可以再按「連接資料夾」重新選。', 'error');
        return;
      }
    } else {
      dir = await window.showDirectoryPicker({ id: 'signin', mode: 'readwrite', startIn: 'desktop' });
    }
    await useFolder(dir);
  } catch (e) {
    if (e.name === 'AbortError') return;   // 選資料夾時按了取消
    showMsg('無法連接資料夾：' + e.message, 'error');
  }
}

// 按「換資料夾」：選錯資料夾時改選另一個（新資料夾有 signin.db 就讀它，沒有就把目前的資料寫進去）
async function changeFolder() {
  try {
    const dir = await window.showDirectoryPicker({ id: 'signin', mode: 'readwrite', startIn: 'desktop' });
    const old = folder;
    folder = null;
    if (!(await useFolder(dir))) {
      folder = old;
      showFolderState('connected');
    }
  } catch (e) {
    if (e.name === 'AbortError') return;   // 選資料夾時按了取消，維持原本的資料夾
    showMsg('無法換資料夾：' + e.message, 'error');
  }
}

// 打開網頁時接回上次的資料夾：權限還在就直接讀 signin.db；不在就請使用者按「重新連接」（瀏覽器規定要按按鈕才能要權限）
async function restoreFolder() {
  if (!folderSupported()) {
    showFolderState('unsupported');
    return;
  }
  const dir = await recallFolder();
  if (!dir) {
    showFolderState('none');
    return;
  }
  let permission = 'prompt';
  try {
    permission = await dir.queryPermission({ mode: 'readwrite' });
  } catch (e) {
    /* 問不到權限就當成要重新允許 */
  }
  if (permission === 'granted' && await useFolder(dir).catch(() => false)) return;
  savedFolder = dir;
  showFolderState('reconnect');
}

// 建立兩張資料表：courses（課程）、enrollments（報名）
function createTables() {
  run(`CREATE TABLE IF NOT EXISTS courses (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    title TEXT NOT NULL,
    date TEXT NOT NULL,
    start_time TEXT NOT NULL,
    location TEXT NOT NULL,
    capacity INTEGER NOT NULL CHECK (capacity >= 1),
    hours REAL NOT NULL CHECK (hours > 0)
  )`);
  run(`CREATE TABLE IF NOT EXISTS enrollments (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    course_id INTEGER NOT NULL REFERENCES courses(id),
    emp_no TEXT NOT NULL,
    name TEXT NOT NULL,
    dept TEXT NOT NULL,
    enrolled_at TEXT NOT NULL,
    checked_in_at TEXT,
    UNIQUE (course_id, emp_no)
  )`);
}

// 放入示範資料：兩堂課、六筆報名
function seedDemo() {
  run('INSERT INTO courses (title, date, start_time, location, capacity, hours) VALUES (?, ?, ?, ?, ?, ?)', ['消防安全講習', '2026-11-05', '14:00', '第一會議室', 40, 2]);
  run('INSERT INTO courses (title, date, start_time, location, capacity, hours) VALUES (?, ?, ?, ?, ?, ?)', ['個資保護與資安宣導', '2026-11-12', '10:00', '教學大樓 3F 視聽室', 3, 1]);
  const demo = [
    [1, 'E1001', '陳美玲', '護理部', '2026-10-19 10:15', '2026-11-05 13:52'],
    [1, 'E1002', '林志明', '總務室', '2026-10-19 10:16', null],
    [1, 'E1003', '黃淑芬', '藥劑部', '2026-10-19 10:18', '2026-11-05 13:55'],
    [1, 'E1004', '吳家豪', '資訊室', '2026-10-19 10:20', null],
    [2, 'E1001', '陳美玲', '護理部', '2026-10-19 10:22', null],
    [2, 'E1005', '許雅雯', '人資室', '2026-10-19 10:25', null]
  ];
  demo.forEach(row => run('INSERT INTO enrollments (course_id, emp_no, name, dept, enrolled_at, checked_in_at) VALUES (?, ?, ?, ?, ?, ?)', row));
}

/* ===== 第一步：新增課程、報名 ===== */

// 新增課程：所有欄位必填，名額至少 1 人、時數大於 0
function addCourse() {
  const v = id => document.getElementById(id).value.trim();
  const title = v('cTitle'), date = v('cDate'), time = v('cTime'), location = v('cLocation');
  const capacity = Number(v('cCapacity')), hours = Number(v('cHours'));
  if (!title || !date || !time || !location || !v('cCapacity') || !v('cHours')) {
    showMsg('請填寫完整的課程資料', 'error');
    return;
  }
  if (!Number.isInteger(capacity) || capacity < 1) {
    showMsg('名額至少 1 人，而且要是整數', 'error');
    return;
  }
  if (!(hours > 0)) {
    showMsg('時數要大於 0', 'error');
    return;
  }
  run('INSERT INTO courses (title, date, start_time, location, capacity, hours) VALUES (?, ?, ?, ?, ?, ?)', [title, date, time, location, capacity, hours]);
  save();
  ['cTitle', 'cDate', 'cTime', 'cLocation', 'cCapacity', 'cHours'].forEach(id => { document.getElementById(id).value = ''; });
  render();
  showMsg(`已新增課程「${title}」`);
}

// 報名：檢查必填與格式、名額已滿、重複報名
function enroll() {
  if (currentCourseId === null) {
    showMsg('請先在課程清單按「查看名單」選一堂課', 'error');
    return;
  }
  const empNo = document.getElementById('eEmpNo').value.trim().toUpperCase();
  const name = document.getElementById('eName').value.trim();
  const dept = document.getElementById('eDept').value;
  if (!empNo || !name || !dept) {
    showMsg('請填寫員工編號、姓名、單位', 'error');
    return;
  }
  if (!/^E\d{4}$/.test(empNo)) {
    showMsg('員工編號格式為 E 加 4 碼數字，例如 E1001', 'error');
    return;
  }
  const course = query('SELECT title, capacity FROM courses WHERE id = ?', [currentCourseId])[0];
  const count = query('SELECT COUNT(*) AS n FROM enrollments WHERE course_id = ?', [currentCourseId])[0].n;
  if (count >= course.capacity) {
    showMsg('名額已滿，無法報名', 'error');
    return;
  }
  const dup = query('SELECT id FROM enrollments WHERE course_id = ? AND emp_no = ?', [currentCourseId, empNo]);
  if (dup.length > 0) {
    showMsg(`${empNo} 已報名過這堂課`, 'error');
    return;
  }
  run('INSERT INTO enrollments (course_id, emp_no, name, dept, enrolled_at) VALUES (?, ?, ?, ?, ?)', [currentCourseId, empNo, name, dept, nowText()]);
  save();
  document.getElementById('eEmpNo').value = '';
  document.getElementById('eName').value = '';
  render();
  showMsg(`${name} 已報名「${course.title}」`);
}

/* ===== 畫面 ===== */

// 重畫整個畫面：課程清單與報名名單
function render() {
  renderCourses();
  renderRoster();
}

// 課程清單：報名人數／名額、出席率、查看名單按鈕
function renderCourses() {
  const rows = query(`SELECT c.*, (SELECT COUNT(*) FROM enrollments e WHERE e.course_id = c.id) AS enrolled
                      FROM courses c ORDER BY c.date, c.start_time, c.id`);
  document.querySelector('#courseTable tbody').innerHTML = rows.map(c => `
    <tr>
      <td>${esc(c.title)}</td>
      <td>${esc(c.date)}</td>
      <td>${esc(c.start_time)}</td>
      <td>${esc(c.location)}</td>
      <td>${c.enrolled} / ${c.capacity} 人</td>
      <td>${esc(attendanceText(c.id))}</td>
      <td><button data-view="${c.id}">查看名單</button></td>
    </tr>`).join('') || '<tr><td colspan="7">還沒有課程</td></tr>';
}

// 報名名單：已簽到顯示時間，還沒簽到顯示「簽到」按鈕
function renderRoster() {
  const box = document.getElementById('roster');
  const course = currentCourseId === null ? null : query('SELECT * FROM courses WHERE id = ?', [currentCourseId])[0];
  if (!course) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  document.getElementById('rosterTitle').textContent = `報名名單：${course.title}（${course.date} ${course.start_time}，${course.location}）`;
  const people = query('SELECT * FROM enrollments WHERE course_id = ? ORDER BY id', [currentCourseId]);
  document.querySelector('#rosterTable tbody').innerHTML = people.map(p => `
    <tr>
      <td>${esc(p.emp_no)}</td>
      <td>${esc(p.name)}</td>
      <td>${esc(p.dept)}</td>
      <td>${esc(p.enrolled_at)}</td>
      <td>${p.checked_in_at ? `<span class="checked">✔ ${esc(p.checked_in_at)}</span>` : `<button data-checkin="${p.id}">簽到</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="5">還沒有人報名</td></tr>';
}

/* ===== 功能插槽：第二步的三個功能 ===== */

// ===== 功能插槽 1：簽到 checkIn（開始）=====
// 簽到：記下這筆報名的簽到時間；每人每堂課只能簽到一次
function checkIn(enrollmentId) {
  // 找出這筆報名
  const rows = query('SELECT name, checked_in_at FROM enrollments WHERE id = ?', [enrollmentId]);
  if (rows.length === 0) {
    showMsg('找不到這筆報名資料', 'error');
    return;
  }
  const person = rows[0];
  // 已經簽到過就不能再簽
  if (person.checked_in_at) {
    showMsg(`${person.name} 已經簽到過了`, 'error');
    return;
  }
  // 記下現在時間，存檔並重畫畫面
  run('UPDATE enrollments SET checked_in_at = ? WHERE id = ?', [nowText(), enrollmentId]);
  save();
  render();
  showMsg(`${person.name} 簽到完成`);
}
// ===== 功能插槽 1：簽到 checkIn（結束）=====

// ===== 功能插槽 2：出席率 attendanceText（開始）=====
// 出席率：已簽到人數 ÷ 報名人數，四捨五入到整數；沒人報名顯示「—」
function attendanceText(courseId) {
  // 報名人數
  const total = query('SELECT COUNT(*) AS n FROM enrollments WHERE course_id = ?', [courseId])[0].n;
  if (total === 0) return '—';
  // 已簽到人數（checked_in_at 有值）
  const done = query('SELECT COUNT(*) AS n FROM enrollments WHERE course_id = ? AND checked_in_at IS NOT NULL', [courseId])[0].n;
  return Math.round(done / total * 100) + '%';
}
// ===== 功能插槽 2：出席率 attendanceText（結束）=====

// ===== 功能插槽 3：匯出 CSV exportCsv（開始）=====
// 匯出簽到名單：開頭加 UTF-8 BOM，Excel 打開中文才不會亂碼
function exportCsv(courseId) {
  const course = query('SELECT title, date FROM courses WHERE id = ?', [courseId])[0];
  if (!course) {
    showMsg('請先在課程清單按「查看名單」選一堂課', 'error');
    return;
  }
  const people = query('SELECT emp_no, name, dept, checked_in_at FROM enrollments WHERE course_id = ? ORDER BY id', [courseId]);
  // 欄位內容有逗號、雙引號或換行時，要用雙引號包起來
  const cell = value => {
    const s = String(value == null ? '' : value);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [['課程名稱', '上課日期', '員工編號', '姓名', '單位', '簽到狀態', '簽到時間'].join(',')];
  people.forEach(p => {
    lines.push([course.title, course.date, p.emp_no, p.name, p.dept, p.checked_in_at ? '已簽到' : '未簽到', p.checked_in_at || ''].map(cell).join(','));
  });
  downloadFile(`簽到名單_${course.title}.csv`, '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  showMsg(`已匯出「${course.title}」的簽到名單，共 ${people.length} 人`);
}
// ===== 功能插槽 3：匯出 CSV exportCsv（結束）=====

/* ===== 啟動 ===== */

// 綁定按鈕：新增課程、報名、匯出、重設，以及清單裡的「查看名單」「簽到」
function bindEvents() {
  document.getElementById('btnAddCourse').addEventListener('click', addCourse);
  document.getElementById('btnEnroll').addEventListener('click', enroll);
  document.getElementById('btnExport').addEventListener('click', () => exportCsv(currentCourseId));
  document.getElementById('btnReset').addEventListener('click', resetDemo);
  document.getElementById('btnFolder').addEventListener('click', connectFolder);
  document.getElementById('btnChangeFolder').addEventListener('click', changeFolder);
  document.addEventListener('click', e => {
    const view = e.target.closest('[data-view]');
    if (view) {
      currentCourseId = Number(view.dataset.view);
      render();
      document.getElementById('roster').scrollIntoView?.({ behavior: 'smooth' });
    }
    const btn = e.target.closest('[data-checkin]');
    if (btn) checkIn(Number(btn.dataset.checkin));
  });
}

// 重設為示範資料（會清掉目前所有資料）
function resetDemo() {
  if (!confirm('要清掉目前所有資料，重設為示範資料嗎？（已連接資料夾時，signin.db 也會一起被覆蓋）')) return;
  db.close();
  db = new SQL.Database();
  createTables();
  seedDemo();
  save();
  currentCourseId = null;
  render();
  showMsg('已重設為示範資料');
}

// 啟動：載入 sql.js、先放示範資料畫出畫面，再接回上次連接的資料夾（有的話改讀 signin.db）
async function init() {
  if (typeof initSqlJs !== 'function') {
    showMsg('無法載入資料庫元件（sql.js），請確認有連上網路後重新整理。', 'error');
    return;
  }
  try {
    SQL = await initSqlJs({ locateFile: file => SQL_JS_BASE + file });
    db = new SQL.Database();
    createTables();
    seedDemo();
    document.getElementById('eDept').innerHTML = '<option value="">選擇單位</option>' + DEPTS.map(d => `<option>${esc(d)}</option>`).join('');
    bindEvents();
    render();
    await restoreFolder();
    document.body.dataset.ready = '1';
  } catch (e) {
    showMsg('資料庫啟動失敗：' + e.message, 'error');
  }
}

init();
</script>
